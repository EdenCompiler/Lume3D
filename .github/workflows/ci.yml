name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Install Python build requirements
        run: python -m pip install -r requirements-build.txt
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev xorg-dev xvfb
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLUME_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Python build requirements
        run: python -m pip install -r requirements-build.txt
      - name: Configure
        run: |
          $python = (Get-Command python).Source
          cmake -S . -B build -A x64 -DLUME_WARNINGS_AS_ERRORS=ON "-DPython_EXECUTABLE=$python"
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test device-free suite
        run: ctest --test-dir build -C Debug -R lume_unit_tests --output-on-failure

  mingw:
    name: Windows cross-build (MinGW)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-build.txt
          sudo apt-get update
          sudo apt-get install -y mingw-w64
      - name: Configure
        run: >-
          cmake -S . -B build-mingw
          -DCMAKE_SYSTEM_NAME=Windows
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
          -DCMAKE_BUILD_TYPE=Release
          -DLUME_BUILD_EXAMPLES=OFF
          -DLUME_BUILD_TESTS=OFF
          -DLUME_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-mingw --parallel
